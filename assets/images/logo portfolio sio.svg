<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond sombre (Inchangé) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Dégradé du bouclier : Cyan -> Bleu -> Indigo -> Bleu-violet profond -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#60a5fa"/>
      <stop offset="66%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Dégradé horizontal pour PORTFOLIO : Cyan -> Bleu -> Indigo -> Bleu-violet -->
    <linearGradient id="portfolioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Dégradé pour LS : Cyan -> Bleu -> Indigo -> Bleu-violet -->
    <linearGradient id="lsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Fond Carré 1:1 Sombre avec fine bordure (Inchangé) -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="17" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Symbole Bouclier (Coordonnées inchangées) -->
  <path d="M50 12 L70 21 V39 C70 51 50 61 50 61 C50 61 30 51 30 39 V21 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Réseau interne (Coordonnées inchangées) -->
  <line x1="50" y1="30" x2="41" y2="43" stroke="#38bdf8" stroke-width="2"/>
  <line x1="50" y1="30" x2="59" y2="43" stroke="#38bdf8" stroke-width="2"/>
  <line x1="41" y1="43" x2="59" y2="43" stroke="#38bdf8" stroke-width="2"/>

  <!-- Points colorés (Coordonnées inchangées) -->
  <circle cx="50" cy="30" r="3" fill="#38bdf8"/>
  <circle cx="41" cy="43" r="3" fill="#818cf8"/>
  <circle cx="59" cy="43" r="3" fill="#818cf8"/>

  <!-- Mot PORTFOLIO (Coordonnées inchangées) -->
  <text x="50" y="74" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="6.8" 
        font-weight="800" 
        fill="url(#portfolioGrad)" 
        text-anchor="middle" 
        letter-spacing="2.5">PORTFOLIO</text>

  <!-- Monogramme LS (Coordonnées inchangées) -->
  <text x="50" y="88" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="900" 
        fill="url(#lsGrad)" 
        text-anchor="middle" 
        letter-spacing="2.5">LS</text>
</svg>
